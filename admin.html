<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BANKRUPT Admin Panel</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Permanent+Marker&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body { background-color: #0b0f0c; color: #e2e8f0; font-family: 'Inter', sans-serif; }
    .font-marker { font-family: 'Permanent Marker', cursive; }
    .neon-text { color: #00ff66; text-shadow: 0 0 10px rgba(0, 255, 102, 0.6); }
    .card-bg { background-color: #121814; border: 1px solid #1c2620; }
  </style>
</head>
<body class="pb-28 max-w-md mx-auto relative min-h-screen border-x border-gray-900 p-4 space-y-4">

  <!-- HEADER -->
  <header class="flex items-center justify-between py-4">
    <h1 class="font-marker text-2xl neon-text">ADMIN PANEL</h1>
    <a href="index.html" class="text-xs bg-[#121814] border border-[#1c2620] text-gray-300 px-3 py-1.5 rounded-lg hover:border-[#00ff66] transition-colors">
      Back to App
    </a>
  </header>

  <!-- MAINTENANCE MODE TOGGLE CARD -->
  <div class="card-bg rounded-2xl p-4 border border-[#1c2620] flex items-center justify-between">
    <div>
      <h2 class="text-white font-bold text-sm">System Maintenance</h2>
      <p class="text-xs text-gray-500">Lock app for non-admin users</p>
    </div>
    <button id="maintenance-btn" onclick="toggleMaintenance()" class="px-4 py-2 bg-yellow-600/20 text-yellow-400 border border-yellow-500/40 font-bold text-xs rounded-xl hover:bg-yellow-500/30 transition-all">
      Checking...
    </button>
  </div>

  <!-- PUBLISH TASK CARD -->
  <div class="card-bg rounded-2xl p-4 border border-[#1c2620] space-y-3">
    <h2 class="text-[#00ff66] font-bold text-sm tracking-wider uppercase flex items-center gap-2">
      <span>📌</span> Create New Task
    </h2>
    <div class="space-y-3 text-xs">
      <input type="text" id="task-title" placeholder="Task Title (e.g. Retweet Post on X)" class="w-full bg-[#0a0d0b] border border-[#1c2620] rounded-xl p-3 text-sm text-white focus:outline-none focus:border-[#00ff66]">
      <input type="number" step="0.01" id="task-reward" placeholder="Reward (e.g. 5.00)" class="w-full bg-[#0a0d0b] border border-[#1c2620] rounded-xl p-3 text-sm text-white focus:outline-none focus:border-[#00ff66]">
      <input type="text" id="task-icon" placeholder="Icon Emoji (e.g. 🐦 or 📌)" class="w-full bg-[#0a0d0b] border border-[#1c2620] rounded-xl p-3 text-sm text-white focus:outline-none focus:border-[#00ff66]">
      <input type="url" id="task-link" placeholder="Target Link (https://x.com/...)" class="w-full bg-[#0a0d0b] border border-[#1c2620] rounded-xl p-3 text-sm text-white focus:outline-none focus:border-[#00ff66]">
      
      <div>
        <label class="text-gray-400 block mb-1">Select Tab Category:</label>
        <select id="task-category" class="w-full bg-[#0a0d0b] border border-[#1c2620] rounded-xl p-3 text-sm text-white focus:outline-none focus:border-[#00ff66]">
          <option value="Daily">Daily</option>
          <option value="Partners">Partners</option>
          <option value="Special">Special</option>
        </select>
      </div>

      <label class="flex items-center gap-2 text-gray-300 cursor-pointer pt-1">
        <input type="checkbox" id="task-proof-req" class="rounded bg-[#0a0d0b] border-[#1c2620] text-[#00ff66] focus:ring-0">
        <span>Require Proof (e.g. Tweet Link / URL)</span>
      </label>

      <button onclick="handlePublishTask()" class="w-full py-3 bg-[#00ff66] text-black font-bold text-sm rounded-xl hover:bg-[#00e65c] transition-all mt-2">
        Publish Task
      </button>
    </div>
  </div>

  <!-- MANAGE ACTIVE TASKS CARD -->
  <div class="card-bg rounded-2xl p-4 border border-[#1c2620] space-y-3">
    <h2 class="text-[#00ff66] font-bold text-sm tracking-wider uppercase flex items-center gap-2">
      <span>📋</span> Manage Active Tasks
    </h2>
    <div id="active-tasks-list" class="space-y-2 text-xs text-gray-400">
      Loading tasks...
    </div>
  </div>

  <!-- GRANT TOKEN BONUS CARD -->
  <div class="card-bg rounded-2xl p-4 border border-[#1c2620] space-y-3">
    <h2 class="text-[#00ff66] font-bold text-sm tracking-wider uppercase flex items-center gap-2">
      <span>🎁</span> Grant Token Bonus
    </h2>
    <div class="space-y-3">
      <input type="text" id="bonus-uid-input" placeholder="User UID" class="w-full bg-[#0a0d0b] border border-[#1c2620] rounded-xl p-3 text-sm text-white focus:outline-none focus:border-[#00ff66]">
      <input type="number" step="0.0001" id="bonus-amount-input" placeholder="Bonus BKT Amount (e.g. 100)" class="w-full bg-[#0a0d0b] border border-[#1c2620] rounded-xl p-3 text-sm text-white focus:outline-none focus:border-[#00ff66]">
      <button onclick="handleGrantBonus()" class="w-full py-3 bg-[#00ff66] text-black font-bold text-sm rounded-xl hover:bg-[#00e65c] transition-all">
        Grant Bonus BKT
      </button>
    </div>
  </div>

  <!-- MANAGE USER REFERRALS CARD -->
  <div class="card-bg rounded-2xl p-4 border border-[#1c2620] space-y-3">
    <h2 class="text-[#00ff66] font-bold text-sm tracking-wider uppercase flex items-center gap-2">
      <span>👥</span> Manage User Referrals
    </h2>
    <div class="space-y-3">
      <input type="text" id="ref-uid-input" placeholder="User UID" class="w-full bg-[#0a0d0b] border border-[#1c2620] rounded-xl p-3 text-sm text-white focus:outline-none focus:border-[#00ff66]">
      <input type="number" id="ref-count-input" placeholder="Additional Referral Count (e.g. 5)" class="w-full bg-[#0a0d0b] border border-[#1c2620] rounded-xl p-3 text-sm text-white focus:outline-none focus:border-[#00ff66]">
      <button onclick="handleAddReferrals()" class="w-full py-3 bg-[#00ff66] text-black font-bold text-sm rounded-xl hover:bg-[#00e65c] transition-all">
        Add Referrals
      </button>
    </div>
  </div>

  <!-- BAN / UNBAN USER CARD -->
  <div class="card-bg rounded-2xl p-4 border border-[#1c2620] space-y-3">
    <h2 class="text-[#00ff66] font-bold text-sm tracking-wider uppercase flex items-center gap-2">
      <span>🚫</span> Ban / Unban User
    </h2>
    <div class="space-y-3">
      <input type="text" id="ban-uid-input" placeholder="User UID to Ban/Unban" class="w-full bg-[#0a0d0b] border border-[#1c2620] rounded-xl p-3 text-sm text-white focus:outline-none focus:border-[#00ff66]">
      <div class="grid grid-cols-2 gap-2">
        <button onclick="handleBanUser(true)" class="py-3 bg-red-600/80 text-white font-bold text-sm rounded-xl hover:bg-red-600 transition-all">
          Ban User
        </button>
        <button onclick="handleBanUser(false)" class="py-3 bg-[#00ff66] text-black font-bold text-sm rounded-xl hover:bg-[#00e65c] transition-all">
          Unban User
        </button>
      </div>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <!-- App Scripts -->
  <script src="firebase-config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
