<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - BANKRUPT</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Permanent+Marker&display=swap" rel="stylesheet">
  <style>
    body { background-color: #0b0f0c; color: #e2e8f0; font-family: 'Inter', sans-serif; }
    .font-marker { font-family: 'Permanent Marker', cursive; }
    .neon-text { color: #00ff66; text-shadow: 0 0 10px rgba(0, 255, 102, 0.6); }
    .card-bg { background-color: #121814; border: 1px solid #1c2620; }
    input, select { background-color: #0a0d0b; border: 1px solid #1c2620; color: #fff; padding: 10px; border-radius: 8px; width: 100%; outline: none; font-size: 13px; }
    input:focus, select:focus { border-color: #00ff66; }
  </style>
</head>
<body class="max-w-md mx-auto relative min-h-screen border-x border-gray-900 px-4 py-6 space-y-4">

  <div class="text-center my-2">
    <h1 class="font-marker text-2xl neon-text">👑 BANKRUPT CONTROL CENTER</h1>
  </div>

  <!-- APP STATUS / MAINTENANCE -->
  <div class="card-bg rounded-2xl p-4 flex items-center justify-between">
    <div>
      <h2 class="font-bold text-sm text-[#00ff66]">App Status</h2>
      <p class="text-[11px] text-gray-400">Pause app for upgrades</p>
    </div>
    <button id="maint-btn" onclick="toggleMaintenance()" class="px-4 py-2 rounded-xl text-xs font-bold bg-[#00ff66] text-black">
      Loading...
    </button>
  </div>

  <!-- ADD NEW TASK -->
  <div class="card-bg rounded-2xl p-4 space-y-3">
    <h2 class="font-bold text-sm text-[#00ff66]">Add New Task</h2>
    <input type="text" id="task-title" placeholder="Task Title (e.g. Retweet Post on X)">
    <input type="number" id="task-reward" placeholder="Reward (e.g. 5.00)">
    <input type="text" id="task-icon" placeholder="Icon Emoji (e.g. 🐦 or 📌)">
    <input type="text" id="task-link" placeholder="Target Link (https://x.com/...)">
    <div>
      <label class="text-[11px] text-gray-400 block mb-1">Select Tab Category:</label>
      <select id="task-category">
        <option value="Daily">Daily</option>
        <option value="Social">Social</option>
        <option value="Community">Community</option>
        <option value="Extra">Extra</option>
      </select>
    </div>

    <!-- REQUIRE PROOF TOGGLE -->
    <div class="flex items-center gap-2 pt-1">
      <input type="checkbox" id="task-proof" class="w-4 h-4 accent-[#00ff66] cursor-pointer">
      <label for="task-proof" class="text-xs text-gray-300 font-medium cursor-pointer">Require Proof (e.g. Tweet Link / URL)</label>
    </div>

    <button onclick="publishTask()" class="w-full py-2.5 bg-[#00ff66] text-black font-bold text-xs rounded-xl hover:bg-[#00e65c]">
      Publish Task
    </button>
  </div>

  <!-- MANAGE ACTIVE TASKS -->
  <div class="card-bg rounded-2xl p-4 space-y-3">
    <h2 class="font-bold text-sm text-[#00ff66]">Manage Active Tasks</h2>
    <div id="admin-tasks-list" class="space-y-2">
      <p class="text-xs text-gray-500">Loading tasks...</p>
    </div>
  </div>

  <!-- MANAGE USER BALANCE & REFERRALS -->
  <div class="card-bg rounded-2xl p-4 space-y-3">
    <h2 class="font-bold text-sm text-[#00ff66]">Manage User Balance / Referrals</h2>
    <input type="text" id="user-uid" placeholder="User UID">
    <input type="number" id="bonus-amount" placeholder="Bonus BKT Amount">
    <button onclick="grantBonus()" class="w-full py-2.5 bg-[#00ff66] text-black font-bold text-xs rounded-xl hover:bg-[#00e65c]">
      Grant Bonus BKT
    </button>
  </div>

  <!-- BAN / UNBAN USER -->
  <div class="card-bg rounded-2xl p-4 space-y-3">
    <h2 class="font-bold text-sm text-[#00ff66]">Ban / Unban User</h2>
    <input type="text" id="ban-uid" placeholder="User UID to Ban/Unban">
    <div class="flex gap-2">
      <button onclick="setUserBanState(true)" class="w-1/2 py-2.5 bg-red-500 text-white font-bold text-xs rounded-xl">Ban User</button>
      <button onclick="setUserBanState(false)" class="w-1/2 py-2.5 bg-[#00ff66] text-black font-bold text-xs rounded-xl">Unban User</button>
    </div>
  </div>

  <!-- Firebase Logic -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>

  <script>
    let currentMaintState = false;

    db.ref("system/maintenance").on("value", (snap) => {
      currentMaintState = snap.val() || false;
      const btn = document.getElementById("maint-btn");
      if (currentMaintState) {
        btn.innerText = "PAUSED (OFF)";
        btn.className = "px-4 py-2 rounded-xl text-xs font-bold bg-red-500 text-white";
      } else {
        btn.innerText = "ONLINE (LIVE)";
        btn.className = "px-4 py-2 rounded-xl text-xs font-bold bg-[#00ff66] text-black";
      }
    });

    function toggleMaintenance() {
      db.ref("system/maintenance").set(!currentMaintState);
    }

    function publishTask() {
      const title = document.getElementById("task-title").value.trim();
      const reward = parseFloat(document.getElementById("task-reward").value);
      const icon = document.getElementById("task-icon").value.trim() || '📌';
      const link = document.getElementById("task-link").value.trim() || '#';
      const category = document.getElementById("task-category").value;
      const requiresProof = document.getElementById("task-proof").checked;

      if (!title || isNaN(reward)) return alert("Please fill Title and Reward");

      const newTaskRef = db.ref("tasks").push();
      newTaskRef.set({ title, reward, icon, link, category, requiresProof }, (err) => {
        if (!err) {
          alert("Task published successfully!");
          document.getElementById("task-title").value = "";
          document.getElementById("task-reward").value = "";
          document.getElementById("task-icon").value = "";
          document.getElementById("task-link").value = "";
          document.getElementById("task-proof").checked = false;
        } else {
          alert("Failed to publish task.");
        }
      });
    }

    db.ref("tasks").on("value", (snap) => {
      const container = document.getElementById("admin-tasks-list");
      container.innerHTML = "";
      const tasks = snap.val() || {};
      
      Object.entries(tasks).forEach(([id, task]) => {
        const item = document.createElement("div");
        item.className = "flex items-center justify-between p-2 rounded-lg bg-[#0a0d0b] border border-[#1c2620]";
        item.innerHTML = `
          <div>
            <p class="text-xs font-bold text-white">${task.title} (${task.category}) ${task.requiresProof ? '🔒' : ''}</p>
            <p class="text-[10px] text-[#00ff66]">+${task.reward} BKT</p>
          </div>
          <button onclick="deleteTask('${id}')" class="px-2 py-1 bg-red-500/20 text-red-400 border border-red-500/30 text-[10px] rounded">Delete</button>
        `;
        container.appendChild(item);
      });
    });

    function deleteTask(id) {
      if (confirm("Delete this task?")) db.ref(`tasks/${id}`).remove();
    }

    function grantBonus() {
      const uid = document.getElementById("user-uid").value.trim();
      const bonus = parseFloat(document.getElementById("bonus-amount").value);
      if (!uid || isNaN(bonus)) return alert("Fill UID and Bonus Amount");

      db.ref(`users/${uid}/balance`).transaction((curr) => (curr || 0) + bonus, (err) => {
        if (!err) alert(`Successfully added ${bonus} BKT to user!`);
      });
    }

    function setUserBanState(isBanned) {
      const uid = document.getElementById("ban-uid").value.trim();
      if (!uid) return alert("Enter User UID");

      db.ref(`users/${uid}/isBanned`).set(isBanned, (err) => {
        if (!err) alert(`User ${isBanned ? 'Banned' : 'Unbanned'} successfully!`);
      });
    }
  </script>
</body>
</html>
