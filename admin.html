<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BANKRUPT - Admin Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body { padding: 20px; max-width: 600px; margin: 0 auto; padding-bottom: 80px; }
    .admin-card { background: #111a13; border: 1px solid #1a2b1e; border-radius: 16px; padding: 20px; margin-bottom: 20px; }
    .admin-title { color: #00ff88; font-size: 1.1rem; margin-bottom: 15px; font-weight: 700; }
    .admin-input { width: 100%; padding: 12px; margin-bottom: 12px; background: #080d09; border: 1px solid #1a291c; color: #fff; border-radius: 8px; box-sizing: border-box; }
    .admin-btn { width: 100%; padding: 12px; background: #00ff88; color: #000; font-weight: 700; border: none; border-radius: 8px; cursor: pointer; }
    .admin-btn.danger { background: #ff4d4d; color: #fff; }
    .toggle-row { display: flex; justify-content: space-between; align-items: center; }
    .admin-task-row {
      background: #0b0f0c;
      border: 1px solid #1c261e;
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .admin-task-info { display: flex; align-items: center; gap: 10px; }
    .admin-task-title { color: #ffffff; font-weight: 600; font-size: 0.9rem; }
    .admin-task-meta { color: #889988; font-size: 0.75rem; }
    .btn-delete-admin {
      background: rgba(255, 77, 77, 0.15);
      color: #ff4d4d;
      border: 1px solid rgba(255, 77, 77, 0.3);
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-delete-admin:hover { background: #ff4d4d; color: #ffffff; }
  </style>
</head>
<body>

  <h2 class="brand-font" style="color:#00ff88; text-align:center;">👑 BANKRUPT CONTROL CENTER</h2>

  <!-- Login Overlay -->
  <div id="admin-login-card" class="admin-card">
    <div class="admin-title">ADMIN ACCESS</div>
    <input type="password" id="admin-pass" class="admin-input" placeholder="Enter Security PIN">
    <button onclick="checkAdminPass()" class="admin-btn">Unlock Panel</button>
  </div>

  <!-- Main Panel (Hidden until unlocked) -->
  <div id="panel-content" style="display:none;">

    <!-- Maintenance Switch -->
    <div class="admin-card">
      <div class="toggle-row">
        <div>
          <div class="admin-title" style="margin:0;">App Status</div>
          <small style="color:#889988;">Pause app for upgrades</small>
        </div>
        <button id="maint-toggle-btn" class="admin-btn" style="width:auto; padding: 8px 16px;" onclick="toggleMaintenance()">Loading...</button>
      </div>
    </div>

    <!-- Add New Task -->
    <div class="admin-card">
      <div class="admin-title">Add New Task</div>
      <input type="text" id="task-title" class="admin-input" placeholder="Task Title (e.g. Join Telegram)">
      <input type="number" id="task-reward" class="admin-input" placeholder="Reward (e.g. 5.00)" step="any">
      <input type="text" id="task-icon" class="admin-input" placeholder="Icon Emoji (e.g. ✈️)">
      <input type="text" id="task-link" class="admin-input" placeholder="Target Link (https://...)">
      
      <label style="color:#889988; font-size:0.8rem; display:block; margin-bottom:4px;">Select Tab Category:</label>
      <select id="task-category" class="admin-input" style="color:#fff; background:#080d09;">
        <option value="Daily">Daily</option>
        <option value="Social">Social</option>
        <option value="Community">Community</option>
        <option value="Extra">Extra</option>
      </select>

      <button onclick="createNewTask()" class="admin-btn">Publish Task</button>
    </div>

    <!-- Manage Active Tasks -->
    <div class="admin-card">
      <div class="admin-title">Manage Active Tasks</div>
      <div id="admin-tasks-list">
        <div style="color: #889988; text-align: center;">Loading tasks...</div>
      </div>
    </div>

    <!-- User Referral & Balance Control -->
    <div class="admin-card">
      <div class="admin-title">Manage User Balance / Referrals</div>
      <input type="text" id="user-uid" class="admin-input" placeholder="User UID or Telegram ID">
      <input type="number" id="bonus-bkt" class="admin-input" placeholder="Bonus BKT Amount" step="any">
      <button onclick="grantUserBonus()" class="admin-btn">Grant Bonus BKT</button>
    </div>

    <!-- User Ban System -->
    <div class="admin-card">
      <div class="admin-title">Ban / Unban User</div>
      <input type="text" id="ban-uid" class="admin-input" placeholder="User UID to Ban">
      <div style="display:flex; gap:10px;">
        <button onclick="setUserBan(true)" class="admin-btn danger">Ban User</button>
        <button onclick="setUserBan(false)" class="admin-btn">Unban User</button>
      </div>
    </div>

  </div>

  <!-- Firebase Integration -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBQT7gM7JxE26bFq061VvZauWkEGjyHPWM",
      authDomain: "bankrupt-9068b.firebaseapp.com",
      databaseURL: "https://bankrupt-9068b-default-rtdb.firebaseio.com",
      projectId: "bankrupt-9068b",
      storageBucket: "bankrupt-9068b.firebasestorage.app",
      messagingSenderId: "961644576786",
      appId: "1:961644576786:web:65eff34df07a18067458cb"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const SECRET_PIN = "7777";
    let isMaintenance = false;

    function checkAdminPass() {
      const pin = document.getElementById("admin-pass").value;
      if (pin === SECRET_PIN) {
        document.getElementById("admin-login-card").style.display = "none";
        document.getElementById("panel-content").style.display = "block";
        loadPanelData();
      } else {
        alert("Incorrect Security PIN!");
      }
    }

    function loadPanelData() {
      db.collection("tasks").onSnapshot((snapshot) => {
        const container = document.getElementById("admin-tasks-list");
        container.innerHTML = "";

        if (snapshot.empty) {
          container.innerHTML = `<div style="color: #889988; text-align: center;">No active tasks found.</div>`;
          return;
        }

        snapshot.forEach((doc) => {
          const task = doc.data();
          container.innerHTML += `
            <div class="admin-task-row">
              <div class="admin-task-info">
                <span>${task.icon || '📌'}</span>
                <div>
                  <div class="admin-task-title">${task.title}</div>
                  <div class="admin-task-meta">+${task.reward} BKT • ${task.category || 'Daily'}</div>
                </div>
              </div>
              <button class="btn-delete-admin" onclick="deleteTaskFromAdmin('${doc.id}')">🗑️ Delete</button>
            </div>
          `;
        });
      });

      db.collection("settings").doc("app_state").onSnapshot((doc) => {
        if (doc.exists) {
          isMaintenance = doc.data().maintenance || false;
          const btn = document.getElementById("maint-toggle-btn");
          btn.innerText = isMaintenance ? "Maintenance: ON" : "Maintenance: OFF";
          btn.style.background = isMaintenance ? "#ff4d4d" : "#00ff88";
          btn.style.color = isMaintenance ? "#fff" : "#000";
        }
      });
    }

    function createNewTask() {
      const title = document.getElementById("task-title").value.trim();
      const rawReward = document.getElementById("task-reward").value;
      const icon = document.getElementById("task-icon").value.trim();
      const link = document.getElementById("task-link").value.trim();
      const category = document.getElementById("task-category").value;

      const rewardNumber = parseFloat(rawReward);

      if (!title || isNaN(rewardNumber) || rewardNumber <= 0) {
        return alert("Please fill in a valid title and positive numeric reward amount!");
      }

      db.collection("tasks").add({
        title,
        reward: rewardNumber,
        icon: icon || '📋',
        link: link || '#',
        category,
        createdAt: Date.now()
      }).then(() => {
        alert("Task published successfully!");
        document.getElementById("task-title").value = "";
        document.getElementById("task-reward").value = "";
        document.getElementById("task-icon").value = "";
        document.getElementById("task-link").value = "";
      }).catch((error) => {
        console.error("Error creating task:", error);
        alert("Failed to publish task.");
      });
    }

    async function deleteTaskFromAdmin(taskId) {
      if (confirm("Are you sure you want to delete this task?")) {
        try {
          await db.collection("tasks").doc(taskId).delete();
        } catch (error) {
          alert("Failed to delete task.");
        }
      }
    }

    function toggleMaintenance() {
      db.collection("settings").doc("app_state").set({ maintenance: !isMaintenance }, { merge: true });
    }

    function grantUserBonus() {
      const uid = document.getElementById("user-uid").value.trim();
      const amount = parseFloat(document.getElementById("bonus-bkt").value);
      if (!uid || isNaN(amount)) return alert("Enter valid UID and Amount!");

      db.collection("users").doc(uid).set({
        balance: firebase.firestore.FieldValue.increment(amount)
      }, { merge: true }).then(() => alert(`Granted ${amount} BKT to User: ${uid}`));
    }

    function setUserBan(status) {
      const uid = document.getElementById("ban-uid").value.trim();
      if (!uid) return alert("Enter User UID!");

      db.collection("users").doc(uid).set({ isBanned: status }, { merge: true })
        .then(() => alert(`User ${uid} has been ${status ? 'BANNED' : 'UNBANNED'}`));
    }
  </script>
</body>
</html>
