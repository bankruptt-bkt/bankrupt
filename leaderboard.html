<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard - BANKRUPT Mining App</title>
  
  <!-- Tailwind CSS & App Styles -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
  
  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Permanent+Marker&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body { background-color: #0b0f0c; color: #e2e8f0; font-family: 'Inter', sans-serif; }
    .card-bg { background-color: #121814; border: 1px solid #1c2620; }
    .card-inner { background-color: #0a0d0b; border: 1px solid #162019; }
    .neon-green { color: #00ff66; }
    .bg-neon-green { background-color: #00ff66; }
    
    /* Active Tab Glow */
    .tab-active {
      background-color: #00ff66;
      color: #000000;
      font-weight: 700;
      box-shadow: 0 0 12px rgba(0, 255, 102, 0.4);
    }
  </style>
</head>
<body class="pb-28 max-w-md mx-auto relative min-h-screen border-x border-gray-900">

  <!-- TOP HEADER -->
  <header class="flex items-center justify-between p-4 pt-6">
    <a href="index.html" class="text-gray-300 text-lg p-2 bg-[#121814] rounded-lg border border-[#1c2620] hover:border-[#00ff66] transition-colors">
      <i class="fa-solid fa-chevron-left"></i>
    </a>
    <h1 class="font-bold text-lg text-white tracking-wide">Leaderboard</h1>
    <div class="px-2.5 py-1 bg-[#121814] rounded-lg border border-[#1c2620] text-xs font-semibold text-gray-300 flex items-center gap-1">
      <span>All Time</span>
      <i class="fa-solid fa-chevron-down text-[10px]"></i>
    </div>
  </header>

  <main class="px-4 space-y-4">

    <!-- TAB SWITCHER -->
    <div class="grid grid-cols-3 gap-1 bg-[#121814] p-1 rounded-xl border border-[#1c2620]">
      <button id="tab-balance" onclick="switchLeaderboardTab('balance')" class="py-2 text-xs rounded-lg transition-all tab-active">
        By Balance
      </button>
      <button id="tab-streak" onclick="switchLeaderboardTab('streak')" class="py-2 text-xs rounded-lg text-gray-400 hover:text-white transition-all font-medium">
        By Streak
      </button>
      <button id="tab-referrals" onclick="switchLeaderboardTab('referrals')" class="py-2 text-xs rounded-lg text-gray-400 hover:text-white transition-all font-medium">
        By Referrals
      </button>
    </div>

    <!-- TOP 3 PODIUM SECTION -->
    <div class="grid grid-cols-3 gap-2 items-end pt-4 pb-2" id="podium-container">
      <!-- Dynamic Podium Items Render Here -->
    </div>

    <!-- RANKINGS LIST (RANK 4+) -->
    <div id="leaderboard-list" class="space-y-2 pt-2">
      <p class="text-center text-xs text-gray-500 py-6">Loading rankings...</p>
    </div>

  </main>

  <!-- CURRENT USER FLOATING CARD -->
  <div class="fixed bottom-16 left-1/2 -translate-x-1/2 w-full max-w-md px-4 z-30">
    <div id="user-rank-card" class="bg-[#00ff66] text-black rounded-2xl p-3.5 flex items-center justify-between shadow-[0_0_20px_rgba(0,255,102,0.3)]">
      <div class="flex items-center gap-3">
        <span id="user-current-rank" class="font-black text-sm text-black">#-</span>
        <div class="w-9 h-9 rounded-full overflow-hidden border border-black/30 bg-black/10 flex items-center justify-center">
          <img id="user-rank-avatar" src="assets/images/profile/rookie.jpg" alt="YOU" class="w-full h-full object-cover" onerror="this.onerror=null; this.src='https://api.dicebear.com/7.x/bottts/svg?seed=Bankrupt';">
        </div>
        <div>
          <h4 class="font-bold text-xs tracking-wide">YOU</h4>
          <p id="user-rank-subtext" class="text-[10px] font-semibold opacity-75">Loading position...</p>
        </div>
      </div>
      <div class="text-right flex items-center gap-2">
        <span id="user-rank-score" class="font-bold text-sm tracking-tight">0.00 BKT</span>
        <i class="fa-solid fa-chevron-right text-xs opacity-75"></i>
      </div>
    </div>
  </div>

  <!-- BOTTOM NAVIGATION BAR -->
  <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-[#0a0d0b] border-t border-[#1a241e] px-4 py-2 flex justify-between items-center text-xs text-gray-500 z-40">
    <a href="index.html" class="flex flex-col items-center gap-1 hover:text-gray-300">
      <i class="fa-solid fa-house text-base"></i>
      <span>Home</span>
    </a>
    <a href="shop.html" class="flex flex-col items-center gap-1 hover:text-gray-300">
      <i class="fa-solid fa-cart-shopping text-base"></i>
      <span>Shop</span>
    </a>
    <a href="tasks.html" class="flex flex-col items-center gap-1 hover:text-gray-300">
      <i class="fa-solid fa-clipboard-list text-base"></i>
      <span>Tasks</span>
    </a>
    <a href="leaderboard.html" class="flex flex-col items-center gap-1 text-[#00ff66]">
      <i class="fa-solid fa-trophy text-base"></i>
      <span>Leaderboard</span>
    </a>
    <a href="profile.html" class="flex flex-col items-center gap-1 hover:text-gray-300">
      <i class="fa-solid fa-user text-base"></i>
      <span>Profile</span>
    </a>
  </nav>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <!-- App Scripts -->
  <script src="firebase-config.js"></script>
  <script src="app.js?v=6.0"></script>
  <script src="leaderboard.js?v=1.0"></script>
</body>
</html>
