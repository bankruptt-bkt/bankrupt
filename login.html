<script>
  // 1. CAPTURE REFERRAL CODE ON INITIAL PAGE LOAD
  document.addEventListener("DOMContentLoaded", () => {
    const urlParams = new URLSearchParams(window.location.search);
    const refCode = urlParams.get("ref");
    if (refCode) {
      localStorage.setItem("pendingRef", refCode);
    }
  });

  // 2. GOOGLE OAUTH SIGN IN
  async function handleGoogleSignIn() {
    try {
      const activeAuth = window.auth || firebase.auth();
      const activeDb = window.db || firebase.database();

      const provider = new firebase.auth.GoogleAuthProvider();
      const res = await activeAuth.signInWithPopup(provider);
      await handleUserDatabaseEntry(res.user, activeDb);
      
      window.location.href = 'index.html';
    } catch (err) {
      alert("Google Sign-In Error: " + err.message);
    }
  }

  // 3. TWITTER (X) OAUTH SIGN IN
  async function handleTwitterSignIn() {
    try {
      const activeAuth = window.auth || firebase.auth();
      const activeDb = window.db || firebase.database();

      const provider = new firebase.auth.TwitterAuthProvider();
      const res = await activeAuth.signInWithPopup(provider);
      await handleUserDatabaseEntry(res.user, activeDb);

      window.location.href = 'index.html';
    } catch (err) {
      alert("X (Twitter) Sign-In Error: " + err.message);
    }
  }

  // 4. USER PROFILE CREATION & REFERRAL PROCESSING
  async function handleUserDatabaseEntry(user, activeDb) {
    const userRef = activeDb.ref('users/' + user.uid);
    const snap = await userRef.once('value');
    
    // Only process if this is a brand NEW user
    if (!snap.exists()) {
      const referrerUid = localStorage.getItem("pendingRef");

      // Save new user profile
      await userRef.set({
        uid: user.uid,
        name: user.displayName || 'Miner',
        balance: 50.00,
        referredBy: referrerUid || null,
        referralsCount: 0,
        streakDays: 0,
        lastCheckIn: 0,
        createdAt: Date.now()
      });

      // Increment referrer's inviteCount in Firebase Realtime Database
      if (referrerUid && referrerUid !== user.uid) {
        const referrerRef = activeDb.ref('users/' + referrerUid + '/inviteCount');
        await referrerRef.transaction((currentCount) => {
          return (currentCount || 0) + 1;
        });
        
        // Clean up pending ref code after successful count increment
        localStorage.removeItem("pendingRef");
      }
    }
  }
</script>
