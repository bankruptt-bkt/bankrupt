<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BANKRUPT - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Full height centering layout */
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 100vh;
      padding-bottom: 20px;
    }

    .auth-container {
      width: 100%;
      text-align: center;
    }

    .app-logo-large {
      font-size: 2.2rem;
      margin-bottom: 6px;
    }

    .tagline {
      color: var(--text-gray);
      font-size: 0.85rem;
      margin-bottom: 24px;
    }

    .auth-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
    }

    /* Tab Switcher: Login / Signup */
    .tab-switch {
      display: flex;
      background: #0d130e;
      border-radius: 30px;
      padding: 4px;
      margin-bottom: 20px;
      border: 1px solid var(--card-border);
    }

    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-gray);
      padding: 10px;
      border-radius: 25px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--accent-green);
      color: #000000;
    }

    /* Input Fields */
    .input-group {
      margin-bottom: 14px;
      text-align: left;
    }

    .input-field {
      width: 100%;
      background: #0d130e;
      border: 1px solid var(--card-border);
      border-radius: 30px;
      padding: 14px 18px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }

    .input-field:focus {
      border-color: var(--accent-green);
    }

    /* Buttons */
    .btn-submit {
      width: 100%;
      background: var(--accent-green);
      color: #000;
      border: none;
      padding: 14px;
      border-radius: 30px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 6px;
    }

    .divider {
      display: flex;
      align-items: center;
      color: var(--text-gray);
      font-size: 0.75rem;
      margin: 18px 0;
    }

    .divider::before, .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--card-border);
    }

    .divider span {
      padding: 0 10px;
    }

    /* Google Button */
    .btn-google {
      width: 100%;
      background: #ffffff;
      color: #000000;
      border: none;
      padding: 12px;
      border-radius: 30px;
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
    }

    .forgot-link {
      display: block;
      color: var(--text-gray);
      font-size: 0.8rem;
      margin-top: 16px;
      text-decoration: none;
    }

    .forgot-link:hover {
      color: var(--accent-green);
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <!-- Center Logo Header -->
    <div class="app-logo-large brand-font">👑 BANKRUPT</div>
    <div class="tagline">Robinhood Chain Mining Portal</div>

    <!-- Auth Card -->
    <div class="auth-card">
      
      <!-- Option Selector: Login vs Signup -->
      <div class="tab-switch">
        <button class="tab-btn active" id="tab-login" onclick="switchAuth('login')">Login</button>
        <button class="tab-btn" id="tab-signup" onclick="switchAuth('signup')">Sign Up</button>
      </div>

      <!-- Login Form View -->
      <form id="auth-form" onsubmit="event.preventDefault();">
        <div class="input-group">
          <input type="email" class="input-field" placeholder="Email Address" required>
        </div>
        <div class="input-group">
          <input type="password" class="input-field" placeholder="Password" required>
        </div>

        <button type="submit" class="btn-submit brand-font" id="submit-btn">LOG IN</button>
      </form>

      <div class="divider"><span>OR</span></div>

      <!-- Google Connect Button -->
      <button class="btn-google">
        <svg width="18" height="18" viewBox="0 0 18 18">
          <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.616z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
          <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
        </svg>
        Continue with Google
      </button>

      <!-- Forgot Password Link -->
      <a href="#" class="forgot-link" id="forgot-link">Forgot password?</a>

    </div>
  </div>

  <!-- UI Toggle Script (No Backend Logic Yet) -->
  <script>
    function switchAuth(type) {
      const loginTab = document.getElementById('tab-login');
      const signupTab = document.getElementById('tab-signup');
      const submitBtn = document.getElementById('submit-btn');
      const forgotLink = document.getElementById('forgot-link');

      if (type === 'signup') {
        loginTab.classList.remove('active');
        signupTab.classList.add('active');
        submitBtn.textContent = 'CREATE ACCOUNT';
        forgotLink.style.display = 'none'; // Hide forgot password on signup
      } else {
        signupTab.classList.remove('active');
        loginTab.classList.add('active');
        submitBtn.textContent = 'LOG IN';
        forgotLink.style.display = 'block'; // Show forgot password on login
      }
    }
  </script>

</body>
</html>
