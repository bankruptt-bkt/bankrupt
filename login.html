  display: flex;
  background: #080d09;
  border-radius: 30px;
  padding: 4px;
  margin-bottom: 16px;
  border: 1px solid #1a2b1e;
}

.tab-btn {
  flex: 1;
  background: transparent;
  border: none;
  color: #889988;
  padding: 8px;
  border-radius: 25px;
  font-weight: 600;
  font-size: 0.85rem;
  cursor: pointer;
}

.tab-btn.active {
  background: #00ff88;
  color: #000000;
}

.input-group {
  margin-bottom: 10px;
}

.input-field {
  width: 100%;
  background: #080d09;
  border: 1px solid #1a2b1e;
  border-radius: 12px;
  padding: 12px 14px;
  color: #fff;
  font-size: 0.9rem;
  outline: none;
  box-sizing: border-box;
}

.input-field:focus {
  border-color: #00ff88;
}

.btn-submit {
  width: 100%;
  background: #00ff88;
  color: #000;
  border: none;
  padding: 12px;
  border-radius: 12px;
  font-size: 0.95rem;
  font-weight: 700;
  cursor: pointer;
  margin-top: 4px;
}

.divider {
  display: flex;
  align-items: center;
  color: #889988;
  font-size: 0.75rem;
  margin: 16px 0;
}

.divider::before, .divider::after {
  content: "";
  flex: 1;
  height: 1px;
  background: #1a2b1e;
}

.divider span {
  padding: 0 10px;
}

/* Social Login Buttons */
.social-btns {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 10px;
}

.btn-social {
  width: 100%;
  background: rgba(255, 255, 255, 0.06);
  color: #ffffff;
  border: 1px solid rgba(255, 255, 255, 0.12);
  padding: 11px;
  border-radius: 12px;
  font-size: 0.9rem;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  cursor: pointer;
  box-sizing: border-box;
}

<body>

  <!-- Background Screen -->
  <div class="hero-container">
    <div class="app-logo-large brand-font">👑 BANKRUPT</div>
    <div class="tagline">Robinhood Chain Mining Portal</div>
  </div>

  <!-- Bottom Sheet Drawer -->
  <div class="drawer-overlay">
    <div class="bottom-sheet">
      <div class="sheet-handle"></div>
      
      <div class="sheet-header">
        <div class="sheet-title">Sign In</div>
      </div>

      <!-- Login / Signup Tabs -->
      <div class="tab-switch">
        <button class="tab-btn active" id="tab-login" onclick="switchAuth('login')">Login</button>
        <button class="tab-btn" id="tab-signup" onclick="switchAuth('signup')">Sign Up</button>
      </div>

      <!-- Email / Password Form -->
      <form id="auth-form" onsubmit="handleEmailAuth(event)">
        <div class="input-group">
          <input type="email" id="email" class="input-field" placeholder="Email Address" required>
        </div>
        <div class="input-group">
          <input type="password" id="password" class="input-field" placeholder="Password" required>
        </div>

        <button type="submit" class="btn-submit" id="submit-btn">LOG IN</button>
      </form>

      <div class="divider"><span>OR CONTINUE WITH</span></div>

      <!-- Social Logins -->
      <div class="social-btns">
        <!-- Google -->
        <button class="btn-social" onclick="loginWithGoogle()">
          <svg width="18" height="18" viewBox="0 0 18 18">
            <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.616z"/>
            <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
            <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
            <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
          </svg>
          Google
        </button>

        <!-- Twitter / X -->
        <button class="btn-social" onclick="loginWithTwitter()">
          <svg width="16" height="16" fill="#ffffff" viewBox="0 0 24 24">
            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
          </svg>
          Twitter (X)
        </button>
      </div>

    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBQT7gM7JxE26bFq061VvZauWkEGjyHPWM",
      authDomain: "bankrupt-9068b.firebaseapp.com",
      databaseURL: "https://bankrupt-9068b-default-rtdb.firebaseio.com",
      projectId: "bankrupt-9068b",
      storageBucket: "bankrupt-9068b.firebasestorage.app",
      messagingSenderId: "961644576786",
      appId: "1:961644576786:web:65eff34df07a18067458cb"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    let currentMode = 'login';

    // Redirect user if already logged in
    auth.onAuthStateChanged((user) => {
      if (user) {
        window.location.href = "index.html";
      }
    });

    function switchAuth(type) {
      currentMode = type;
      document.getElementById('tab-login').classList.toggle('active', type === 'login');
      document.getElementById('tab-signup').classList.toggle('active', type === 'signup');
      document.getElementById('submit-btn').textContent = type === 'signup' ? 'CREATE ACCOUNT' : 'LOG IN';
    }

    // Email & Password Authentication Handler
    async function handleEmailAuth(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        if (currentMode === 'signup') {
          await auth.createUserWithEmailAndPassword(email, password);
        } else {
          await auth.signInWithEmailAndPassword(email, password);
        }
        window.location.href = "index.html";
      } catch (error) {
        alert(error.message);
      }
    }

    // Google Provider Login
    async function loginWithGoogle() {
      const provider = new firebase.auth.GoogleAuthProvider();
      try {
        await auth.signInWithPopup(provider);
        window.location.href = "index.html";
      } catch (error) {
        alert(error.message);
      }
    }

    // Twitter Provider Login
    async function loginWithTwitter() {
      const provider = new firebase.auth.TwitterAuthProvider();
      try {
        await auth.signInWithPopup(provider);
        window.location.href = "index.html";
      } catch (error) {
        alert(error.message);
      }
    }
  </script>
