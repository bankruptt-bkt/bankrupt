<script>
  // 1. CAPTURE REFERRAL CODE ON INITIAL PAGE LOAD
  document.addEventListener("DOMContentLoaded", () => {
    const urlParams = new URLSearchParams(window.location.search);
    const refCode = urlParams.get("ref");
    if (refCode) {
      localStorage.setItem("pending_referrer", refCode.trim());
    }
  });

  // 2. GOOGLE OAUTH SIGN IN
  async function handleGoogleSignIn() {
    try {
      const activeAuth = window.auth || firebase.auth();
      const activeDb = window.db || firebase.database();

      const provider = new firebase.auth.GoogleAuthProvider();
      const res = await activeAuth.signInWithPopup(provider);
      await handleUserDatabaseEntry(res.user, activeDb);
      
      window.location.href = 'index.html';
    } catch (err) {
      alert("Google Sign-In Error: " + err.message);
    }
  }

  // 3. TWITTER (X) OAUTH SIGN IN
  async function handleTwitterSignIn() {
    try {
      const activeAuth = window.auth || firebase.auth();
      const activeDb = window.db || firebase.database();

      const provider = new firebase.auth.TwitterAuthProvider();
      const res = await activeAuth.signInWithPopup(provider);
      await handleUserDatabaseEntry(res.user, activeDb);

      window.location.href = 'index.html';
    } catch (err) {
      alert("X (Twitter) Sign-In Error: " + err.message);
    }
  }

  // 4. USER PROFILE CREATION & REAL-TIME REFERRAL REWARDING
  async function handleUserDatabaseEntry(user, activeDb) {
    const userRef = activeDb.ref('users/' + user.uid);
    const snap = await userRef.once('value');
    
    // Execute profile creation and referral tracking only for NEW accounts
    if (!snap.exists()) {
      const referrerUid = localStorage.getItem("pending_referrer");

      const initialUserData = {
        uid: user.uid,
        name: user.displayName || 'Miner_' + user.uid.substring(0, 5),
        balance: 0.00,
        referredBy: (referrerUid && referrerUid !== user.uid) ? referrerUid : null,
        referralsCount: 0,
        streakDays: 0,
        lastCheckIn: 0,
        createdAt: Date.now()
      };

      await userRef.set(initialUserData);

      // Real-time Referral Increment & Sign-Up Bonus Credit to Inviter
      if (referrerUid && referrerUid !== user.uid) {
        const referrerRef = activeDb.ref('users/' + referrerUid);
        const REFERRAL_SIGNUP_BONUS = 5.00;

        await referrerRef.transaction((referrer) => {
          if (referrer) {
            referrer.referralsCount = (referrer.referralsCount || 0) + 1;
            referrer.balance = (referrer.balance || 0) + REFERRAL_SIGNUP_BONUS;
          }
          return referrer;
        });

        // Record history entry
        await activeDb.ref(`users/${referrerUid}/referralHistory`).push({
          referredUserId: user.uid,
          reward: REFERRAL_SIGNUP_BONUS,
          timestamp: Date.now()
        });

        localStorage.removeItem("pending_referrer");
      }
    }
  }
</script>
