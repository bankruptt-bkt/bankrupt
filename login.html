<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BANKRUPT - Sign In</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Permanent+Marker&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body { background-color: #000000; color: #e2e8f0; font-family: 'Inter', sans-serif; }
    .font-marker { font-family: 'Permanent Marker', cursive; }
    .sheet-bg { background-color: #0c120e; border-top: 1px solid #1a261f; }
    .input-field { background-color: #070a08; border: 1px solid #1c2820; color: #ffffff; }
    .input-field:focus { outline: none; border-color: #00ff66; }
  </style>

  <!-- Firebase Web SDK v10 Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <!-- App Config -->
  <script src="firebase-config.js"></script>
</head>
<body class="min-h-screen flex flex-col justify-end max-w-md mx-auto relative overflow-hidden">

  <!-- BOTTOM SHEET CONTAINER -->
  <div class="sheet-bg rounded-t-3xl p-6 space-y-5 w-full relative z-10 shadow-2xl">
    
    <!-- Drag handle indicator -->
    <div class="w-12 h-1 bg-gray-700 rounded-full mx-auto -mt-2 mb-2"></div>

    <h2 class="text-2xl font-bold text-white tracking-tight">Sign In</h2>

    <!-- LOGIN / SIGN UP TABS -->
    <div class="bg-[#060907] p-1 rounded-full flex border border-[#17221a]">
      <button id="tab-login" onclick="switchTab('login')" class="flex-1 py-2.5 rounded-full font-bold text-sm bg-[#00ff66] text-black transition-all">
        Login
      </button>
      <button id="tab-signup" onclick="switchTab('signup')" class="flex-1 py-2.5 rounded-full font-semibold text-sm text-gray-400 hover:text-white transition-all">
        Sign Up
      </button>
    </div>

    <!-- AUTH FORM -->
    <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-3">
      
      <!-- Name field (Hidden by default, shown during Sign Up) -->
      <div id="name-field-wrapper" class="hidden">
        <input type="text" id="display-name" placeholder="Display Name / Username" class="w-full px-4 py-3.5 rounded-xl input-field text-sm" />
      </div>

      <div>
        <input type="email" id="email" required placeholder="Email Address" class="w-full px-4 py-3.5 rounded-xl input-field text-sm" />
      </div>

      <div>
        <input type="password" id="password" required placeholder="Password" class="w-full px-4 py-3.5 rounded-xl input-field text-sm" />
      </div>

      <!-- FORGOT PASSWORD LINK -->
      <div id="forgot-pass-wrapper" class="text-right">
        <button type="button" onclick="openForgotModal()" class="text-xs text-[#00ff66] hover:underline font-medium">
          Forgot Password?
        </button>
      </div>

      <!-- SUBMIT BUTTON -->
      <button type="submit" id="submit-btn" class="w-full py-3.5 bg-[#00ff66] text-black font-extrabold text-sm rounded-xl tracking-wider hover:bg-[#00e65c] transition-all shadow-lg shadow-[#00ff66]/20 mt-2">
        LOG IN
      </button>
    </form>

    <!-- DIVIDER -->
    <div class="relative my-4 flex items-center justify-center">
      <div class="w-full border-t border-gray-800"></div>
      <span class="absolute bg-[#0c120e] px-3 text-[10px] text-gray-500 font-semibold tracking-wider uppercase">
        OR CONTINUE WITH
      </span>
    </div>

    <!-- SOCIAL BUTTONS -->
    <div class="space-y-2.5">
      <button onclick="handleGoogleSignIn()" type="button" class="w-full py-3 bg-[#131b15] border border-[#212f25] rounded-xl flex items-center justify-center gap-2.5 text-sm font-semibold text-white hover:bg-[#1a251d] transition-all">
        <svg class="w-4 h-4" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        Google
      </button>

      <button onclick="alert('Twitter (X) Sign-In requires custom developer OAuth setup in Firebase.')" type="button" class="w-full py-3 bg-[#131b15] border border-[#212f25] rounded-xl flex items-center justify-center gap-2.5 text-sm font-semibold text-white hover:bg-[#1a251d] transition-all">
        <i class="fa-brands fa-x-twitter text-base"></i>
        Twitter (X)
      </button>
    </div>
  </div>

  <!-- FORGOT PASSWORD MODAL -->
  <div id="forgot-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="sheet-bg border border-[#1f2d24] w-full max-w-sm rounded-2xl p-5 space-y-4 shadow-2xl">
      <div class="flex items-center justify-between">
        <h3 class="font-bold text-white text-lg">Reset Password</h3>
        <button onclick="closeForgotModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <p class="text-xs text-gray-400">Enter your account email and we'll send you a link to reset your password.</p>
      
      <input type="email" id="reset-email" placeholder="Enter your email" class="w-full px-4 py-3 rounded-xl input-field text-sm" />
      
      <button onclick="sendPasswordReset()" id="reset-btn" class="w-full py-3 bg-[#00ff66] text-black font-bold text-sm rounded-xl hover:bg-[#00e65c] transition-all">
        Send Reset Link
      </button>
    </div>
  </div>

  <script>
    let currentMode = 'login'; // 'login' or 'signup'

    function switchTab(mode) {
      currentMode = mode;
      const loginTab = document.getElementById('tab-login');
      const signupTab = document.getElementById('tab-signup');
      const submitBtn = document.getElementById('submit-btn');
      const forgotWrapper = document.getElementById('forgot-pass-wrapper');
      const nameWrapper = document.getElementById('name-field-wrapper');

      if (mode === 'login') {
        loginTab.className = "flex-1 py-2.5 rounded-full font-bold text-sm bg-[#00ff66] text-black transition-all";
        signupTab.className = "flex-1 py-2.5 rounded-full font-semibold text-sm text-gray-400 hover:text-white transition-all";
        submitBtn.innerText = "LOG IN";
        forgotWrapper.classList.remove('hidden');
        nameWrapper.classList.add('hidden');
      } else {
        signupTab.className = "flex-1 py-2.5 rounded-full font-bold text-sm bg-[#00ff66] text-black transition-all";
        loginTab.className = "flex-1 py-2.5 rounded-full font-semibold text-sm text-gray-400 hover:text-white transition-all";
        submitBtn.innerText = "CREATE ACCOUNT";
        forgotWrapper.classList.add('hidden');
        nameWrapper.classList.remove('hidden');
      }
    }

    async function handleAuth(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const submitBtn = document.getElementById('submit-btn');

      submitBtn.disabled = true;
      submitBtn.innerText = "PROCESSING...";

      try {
        const activeAuth = window.auth || firebase.auth();
        const activeDb = window.db || firebase.database();

        if (currentMode === 'login') {
          await activeAuth.signInWithEmailAndPassword(email, password);
          window.location.href = 'index.html';
        } else {
          const displayName = document.getElementById('display-name').value.trim() || 'Miner';
          const res = await activeAuth.createUserWithEmailAndPassword(email, password);
          
          await res.user.updateProfile({ displayName: displayName });
          await activeDb.ref('users/' + res.user.uid).set({
            uid: res.user.uid,
            name: displayName,
            balance: 50.00,
            streakDays: 0,
            lastCheckIn: 0,
            createdAt: Date.now()
          });

          window.location.href = 'index.html';
        }
      } catch (err) {
        alert("Authentication Error: " + err.message);
        submitBtn.disabled = false;
        submitBtn.innerText = currentMode === 'login' ? "LOG IN" : "CREATE ACCOUNT";
      }
    }

    // GOOGLE SIGN IN (SAFELY RESOLVED)
    async function handleGoogleSignIn() {
      try {
        const activeAuth = window.auth || firebase.auth();
        const activeDb = window.db || firebase.database();

        const provider = new firebase.auth.GoogleAuthProvider();
        const res = await activeAuth.signInWithPopup(provider);
        const userRef = activeDb.ref('users/' + res.user.uid);
        
        const snap = await userRef.once('value');
        if (!snap.exists()) {
          await userRef.set({
            uid: res.user.uid,
            name: res.user.displayName || 'Miner',
            balance: 50.00,
            streakDays: 0,
            lastCheckIn: 0,
            createdAt: Date.now()
          });
        }
        
        window.location.href = 'index.html';
      } catch (err) {
        alert("Google Sign-In Error: " + err.message);
      }
    }

    function openForgotModal() {
      document.getElementById('forgot-modal').classList.remove('hidden');
    }

    function closeForgotModal() {
      document.getElementById('forgot-modal').classList.add('hidden');
    }

    async function sendPasswordReset() {
      const email = document.getElementById('reset-email').value.trim();
      const resetBtn = document.getElementById('reset-btn');

      if (!email) {
        alert("Please enter your email address.");
        return;
      }

      resetBtn.disabled = true;
      resetBtn.innerText = "SENDING...";

      try {
        const activeAuth = window.auth || firebase.auth();
        await activeAuth.sendPasswordResetEmail(email);
        alert("Password reset link sent! Check your inbox.");
        closeForgotModal();
      } catch (err) {
        alert("Error: " + err.message);
      } finally {
        resetBtn.disabled = false;
        resetBtn.innerText = "Send Reset Link";
      }
    }
  </script>
</body>
</html>
