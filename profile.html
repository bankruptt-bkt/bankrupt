<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BANKRUPT - Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Navbar -->
  <header class="header">
    <div class="logo">
      <span class="brand-font">👤 PROFILE</span>
    </div>
    <span class="username" id="profile-handle">@Loading...</span>
  </header>

  <!-- Profile Card -->
  <div class="hero-card" style="min-height: auto; padding: 20px; background-image: none;">
    <div class="badge">DEGEN USER</div>
    <div class="balance-title">TOTAL $BANKRUPT BALANCE</div>
    <div class="balance-val" id="profile-balance">0.0000 BKT</div>
    <div class="sub-text">Connected to Robinhood Chain</div>
  </div>

  <!-- Stats Breakdown -->
  <div class="section-title">USER PERFORMANCE</div>
  <div class="streak-card">
    <div class="streak-footer" style="margin-top: 0; padding-bottom: 8px; border-bottom: 1px solid var(--card-border);">
      <span>Completed Tasks</span>
      <span class="timer-badge" id="profile-tasks-count">0</span>
    </div>
    <div class="streak-footer" style="margin-top: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--card-border);">
      <span>Current Rank</span>
      <span class="timer-badge" id="profile-rank">#--</span>
    </div>
    <div class="streak-footer" style="margin-top: 12px;">
      <span>Account Status</span>
      <span style="color: var(--accent-green); font-weight: 600;">Active</span>
    </div>
  </div>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <span>🏠</span>
      <span>Home</span>
    </a>
    <a href="shop.html" class="nav-item">
      <span>🛒</span>
      <span>Shop</span>
    </a>
    <a href="tasks.html" class="nav-item">
      <span>📋</span>
      <span>Tasks</span>
    </a>
    <a href="leaderboard.html" class="nav-item">
      <span>🏆</span>
      <span>Leaderboard</span>
    </a>
    <a href="profile.html" class="nav-item active">
      <span>👤</span>
      <span>Profile</span>
    </a>
  </nav>

  <script type="module" src="profile.js"></script>
</body>
</html>
