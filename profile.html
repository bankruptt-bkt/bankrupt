<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BANKRUPT - Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Header -->
  <header class="header">
    <div style="width: 24px;"></div> <!-- Spacer -->
    <span class="brand-font" style="font-size: 1.2rem;">Profile</span>
    <button class="icon-btn" style="background: none; border: none; font-size: 1.2rem; cursor: pointer;">⚙️</button>
  </header>

  <!-- User Identity Card -->
  <div class="profile-card">
    <div class="user-header-row">
      <div class="avatar-wrapper">
        <img src="avatar.png" alt="Avatar" id="user-avatar" onerror="this.src='https://via.placeholder.com/80/000000/89e612?text=Degen'">
      </div>
      <div class="user-info-col">
        <div class="user-name-row">
          <span class="user-fullname" id="profile-name">Probhat Santra</span>
          <span class="edit-icon">✏️</span>
        </div>
        <div class="id-label">BANKRUPT ID</div>
        <div class="id-value-row">
          <span id="bankrupt-id">BK-8F29A</span>
          <span class="copy-icon" onclick="navigator.clipboard.writeText('BK-8F29A')">📋</span>
        </div>
        <div class="level-xp-row">
          <span class="level-badge" id="user-level">Level 12</span>
          <div class="xp-bar-container">
            <div class="xp-bar-fill" id="xp-fill" style="width: 49%;"></div>
            <span class="xp-text" id="xp-text">2,450 / 5,000 XP</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Stats Table Section -->
    <div class="profile-stats-list">
      <div class="stat-row">
        <span class="stat-label">🪙 Total Balance</span>
        <span class="stat-val highlight" id="profile-balance">336.9600 BKT</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">🔥 Current Streak</span>
        <span class="stat-val" id="current-streak">23 Days</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">🏆 Longest Streak</span>
        <span class="stat-val" id="longest-streak">31 Days</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">👥 Total Referrals</span>
        <span class="stat-val" id="total-referrals">5</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">📋 Tasks Completed</span>
        <span class="stat-val" id="tasks-completed">12</span>
      </div>
    </div>

    <!-- Badges Horizontal Row -->
    <div class="badges-header">
      <span>BADGES</span>
      <a href="shop.html" class="view-all">View All</a>
    </div>
    <div class="badges-row">
      <div class="badge-item"><img src="badge1.png" alt="Badge" onerror="this.src='https://via.placeholder.com/50/111/89e612?text=💀'"></div>
      <div class="badge-item"><img src="badge2.png" alt="Badge" onerror="this.src='https://via.placeholder.com/50/111/89e612?text=📅'"></div>
      <div class="badge-item"><img src="badge3.png" alt="Badge" onerror="this.src='https://via.placeholder.com/50/111/89e612?text=👑'"></div>
      <div class="badge-item"><img src="badge4.png" alt="Badge" onerror="this.src='https://via.placeholder.com/50/111/89e612?text=⚡'"></div>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <span>🏠</span>
      <span>Home</span>
    </a>
    <a href="shop.html" class="nav-item">
      <span>🛒</span>
      <span>Shop</span>
    </a>
    <a href="tasks.html" class="nav-item">
      <span>📋</span>
      <span>Tasks</span>
    </a>
    <a href="leaderboard.html" class="nav-item">
      <span>🏆</span>
      <span>Leaderboard</span>
    </a>
    <a href="profile.html" class="nav-item active">
      <span>👤</span>
      <span>Profile</span>
    </a>
  </nav>

  <script type="module" src="profile.js"></script>
</body>
</html>
