<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bankrupt - Shop</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Shop Top Header -->
  <header class="shop-header">
    <button class="icon-btn">⚙️</button>
    <h1 class="shop-title">Shop</h1>
  </header>

  <!-- Filter Categories -->
  <div class="filter-categories">
    <button class="filter-btn active">All</button>
    <button class="filter-btn">Badges</button>
    <button class="filter-btn">Boosts</button>
    <button class="filter-btn">Titles</button>
    <button class="filter-btn">Special</button>
  </div>

  <!-- Horizontal Scrolling Product Cards -->
  <div class="shop-carousel">

    <!-- Card 1 -->
    <div class="shop-card">
      <div class="card-img-box">
        <span class="placeholder-icon">💀</span>
      </div>
      <div class="card-info">
        <h3 class="item-title">Broke Badge</h3>
        <p class="item-desc">Increase flex.</p>
      </div>
      <div class="item-price">
        <span class="coin-icon">🟡</span>
        <span>500 BKT</span>
      </div>
    </div>

    <!-- Card 2 -->
    <div class="shop-card">
      <div class="card-img-box">
        <span class="placeholder-icon">📅</span>
      </div>
      <div class="card-info">
        <h3 class="item-title">7-Day Streak Badge</h3>
        <p class="item-desc">Show your pain.</p>
      </div>
      <div class="item-price">
        <span class="coin-icon">🟡</span>
        <span>2,000 BKT</span>
      </div>
    </div>

    <!-- Card 3 -->
    <div class="shop-card">
      <div class="card-img-box">
        <span class="placeholder-icon">👑</span>
      </div>
      <div class="card-info">
        <h3 class="item-title">Bankrupt King</h3>
        <span class="item-type">Title</span>
        <p class="item-desc">Wear the crown.</p>
      </div>
      <div class="item-price">
        <span class="coin-icon">🟡</span>
        <span>25,000 BKT</span>
      </div>
    </div>

    <!-- Card 4 -->
    <div class="shop-card">
      <div class="card-img-box">
        <span class="placeholder-icon">🔥</span>
      </div>
      <div class="card-info">
        <h3 class="item-title">Financial Ruin</h3>
        <span class="item-type">Special</span>
        <p class="item-desc">Limited Edition.</p>
      </div>
      <div class="item-price">
        <span class="coin-icon">🟡</span>
        <span>100,000 BKT</span>
      </div>
    </div>

  </div>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <span>🏠</span>
      <span>Home</span>
    </a>
    <a href="shop.html" class="nav-item active">
      <span>🛒</span>
      <span>Shop</span>
    </a>
    <a href="tasks.html" class="nav-item">
      <span>📋</span>
      <span>Tasks</span>
    </a>
    <a href="leaderboard.html" class="nav-item">
      <span>🏆</span>
      <span>Leaderboard</span>
    </a>
    <a href="profile.html" class="nav-item">
      <span>👤</span>
      <span>Profile</span>
    </a>
  </nav>

</body>
</html>
