      <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bankrupt - Tasks</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Tasks Header -->
  <header class="shop-header">
    <button class="icon-btn" onclick="history.back()">❮</button>
    <h1 class="shop-title">Tasks</h1>
    <div class="coin-balance">
      <span class="coin-icon">🟡</span>
      <span class="balance-val">0.0000 BKT</span>
    </div>
  </header>

  <!-- Filter Categories -->
  <div class="filter-categories">
    <button class="filter-btn active" data-category="Daily">Daily</button>
    <button class="filter-btn" data-category="Social">Social</button>
    <button class="filter-btn" data-category="Community">Community</button>
    <button class="filter-btn" data-category="Extra">Extra</button>
  </div>

  <!-- Dynamic Tasks Container -->
  <div class="tasks-list" id="tasks-container">
    <!-- Tasks will be dynamically rendered here from Firestore -->
  </div>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <span>🏠</span>
      <span>Home</span>
    </a>
    <a href="shop.html" class="nav-item">
      <span>🛒</span>
      <span>Shop</span>
    </a>
    <a href="tasks.html" class="nav-item active">
      <span>📋</span>
      <span>Tasks</span>
    </a>
    <a href="leaderboard.html" class="nav-item">
      <span>🏆</span>
      <span>Leaderboard</span>
    </a>
    <a href="profile.html" class="nav-item">
      <span>👤</span>
      <span>Profile</span>
    </a>
  </nav>

  <script type="module" src="tasks.js"></script>
</body>
</html>
