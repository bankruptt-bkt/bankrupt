</head>
<body>

  <header class="header">
    <button class="icon-btn" onclick="history.back()">‹</button>

    <div style="width:24px;"></div>
  </header>

  <!-- Category Selection -->
  <div class="tab-container">
    <button class="tab-btn active" onclick="filterTasks('Daily', this)">Daily</button>
    <button class="tab-btn" onclick="filterTasks('Social', this)">Social</button>
    <button class="tab-btn" onclick="filterTasks('Community', this)">Community</button>
    <button class="tab-btn" onclick="filterTasks('Extra', this)">Extra</button>
  </div>

  <!-- Dynamic Tasks List -->
  <div class="tasks-container" id="tasks-list">
    <div style="text-align: center; color: var(--text-gray);">Loading tasks...</div>
  </div>
