        <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BANKRUPT - Whitepaper</title>
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="header">
    <div class="logo">
      <a href="index.html" style="text-decoration: none; color: inherit;">
        <span class="brand-font">📄 WHITEPAPER</span>
      </a>
    </div>
    <a href="index.html" style="color: var(--accent-green); text-decoration: none; font-size: 0.85rem; font-weight: 600;">← Back Home</a>
  </header>

  <!-- Hero Header Card -->
  <div class="hero-card" style="min-height: auto; padding: 20px; background-image: none;">
    <div class="badge">OFFICIAL TECHNICAL SPECIFICATION</div>
    <div class="balance-title">THE $BANKRUPT PROTOCOL</div>
    <div class="balance-val" style="font-size: 1.8rem;">1,000,000,000 $BKT</div>
    <div class="sub-text">Built for the Robinhood Chain Ecosystem</div>
  </div>

  <!-- Dynamic Content Box -->
  <div class="whitepaper-container">
    <div class="doc-section">
      <div id="whitepaper-content" style="white-space: pre-wrap; font-family: 'Inter', sans-serif; font-size: 0.85rem; color: #c0d0c0; line-height: 1.6;">
        Loading whitepaper document...
      </div>
    </div>
  </div>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <span>🏠</span>
      <span>Home</span>
    </a>
    <a href="shop.html" class="nav-item">
      <span>🛒</span>
      <span>Shop</span>
    </a>
    <a href="tasks.html" class="nav-item">
      <span>📋</span>
      <span>Tasks</span>
    </a>
    <a href="leaderboard.html" class="nav-item">
      <span>🏆</span>
      <span>Leaderboard</span>
    </a>
    <a href="profile.html" class="nav-item">
      <span>👤</span>
      <span>Profile</span>
    </a>
  </nav>

  <!-- Auto-Fetch Script for whitepaper.txt -->
  <script>
    async function loadWhitepaperText() {
      const container = document.getElementById('whitepaper-content');
      try {
        const response = await fetch('whitepaper.txt');
        if (!response.ok) {
          throw new Error('Network response was not ok');
        }
        const text = await response.text();
        container.textContent = text;
      } catch (error) {
        console.error('Error loading whitepaper:', error);
        container.innerHTML = `<span style="color: #ff5555;">Failed to load whitepaper.txt. Please verify that whitepaper.txt exists in your root folder.</span>`;
      }
    }

    loadWhitepaperText();
  </script>

</body>
</html>
